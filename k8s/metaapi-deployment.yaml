# Meta API — Kubernetes deployment (HA mode, PostgreSQL backend)
#
# Deploy with: kubectl apply -f metaapi-deployment.yaml
# Requires a Secret "meta-api-db" with keys url/username/password holding the
# PostgreSQL connection settings consumed by application-postgres.yaml.
#
# Probes use the Spring Boot actuator health groups (see application.yaml):
#   /actuator/health/liveness  — process alive? (ping only)
#   /actuator/health/readiness — ready to serve traffic? (db, flyway, ...)
# Both paths are permitAll() in SecurityConfiguration.

apiVersion: v1
kind: Service
metadata:
  name: meta-api
spec:
  type: ClusterIP
  selector:
    app: meta-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meta-api
  labels:
    app: meta-api
spec:
  # Run at least two replicas for HA; the distributed job locks guarantee only
  # one replica runs each scheduled discovery job.
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # never drop below current capacity during a rollout
  selector:
    matchLabels:
      app: meta-api
  template:
    metadata:
      labels:
        app: meta-api
    spec:
      containers:
        - name: meta-api
          image: ghcr.io/neoforged/metaapi:__TAG__   # set by the CI pipeline (jib)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            # INSTANCE_ID is optional — auto-generated from HOSTNAME if unset.
            # Set it explicitly only if you want stable, human-readable ids in logs/locks.
            # - name: INSTANCE_ID
            #   valueFrom:
            #     fieldRef:
            #       fieldPath: metadata.name
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: meta-api-db
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: meta-api-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meta-api-db
                  key: password
            # Connection pool size per replica (HikariCP). With 3 replicas and a
            # modest Postgres, keep this at the default of 15 or lower.
            - name: DB_POOL_SIZE
              value: "15"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36   # allow up to ~3 minutes for JVM boot + migrations
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              # JVM heap is capped at 75% of this (MaxRAMPercentage in build.gradle),
              # leaving headroom for metaspace/native so the pod survives to a
              # graceful restart instead of an OOMKill.
              cpu: "1"
              memory: 1Gi

# NOTE on scaling workers separately: discovery jobs can be CPU/network heavy.
# To run API-only replicas (no background discovery), set these env vars on them:
#   SCHEDULED_TASKS_MAVEN_VERSION_DISCOVERY_ENABLED=false
#   SCHEDULED_TASKS_MINECRAFT_VERSION_DISCOVERY_ENABLED=false
# and keep at least one replica with jobs enabled so discovery keeps running.
