{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "meta-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meta-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.parentRef.name is required when gateway.enabled=true (name of the Gateway)" .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.group }}
      group: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.kind }}
      kind: {{ . }}
      {{- end }}
      {{- if .Values.gateway.parentRef.namespace }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      {{- end }}
      port: {{ required "gateway.port is required when gateway.enabled=true (HTTP listener port on the Gateway)" .Values.gateway.port }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    # No explicit matches: per the Gateway API spec this defaults to a PathPrefix
    # match on "/" for all methods, which is what we want (the app serves /).
    backendRefs:
      - name: {{ include "meta-api.fullname" . }}
        port: {{ required "service.port is required when gateway.enabled=true" .Values.service.port }}
{{- end }}
