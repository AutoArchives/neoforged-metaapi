name: Publish image with plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: neoforged/actions/checkout@main

      - name: Setup Java 25
        uses: neoforged/actions/setup-java@main
        with:
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create Docker Metadata
        id: docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neoforged/metaapi
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=1.0.0
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Build with Gradle (multi-arch amd64 + arm64)
        run: ./gradlew jib -Djib.console=plain
        env:
          GH_USERNAME: '${{ github.actor }}'
          GH_PASSWORD: '${{ github.token }}'
          DOCKER_METADATA_JSON: '${{ steps.docker_metadata.outputs.json }}'

      # Publishes the Helm chart as an OCI artifact to ghcr.io/neoforged/meta-api,
      # tagged with the version from helm/meta-api/Chart.yaml (bump it in the
      # commit when the chart changes). Re-pushing the same tag is idempotent.
      - name: Publish Helm chart to GHCR (OCI)
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$GH_USERNAME" --password-stdin <<< "$GH_TOKEN"
          CHART_VERSION="$(sed -n 's/^version:[[:space:]]*//p' helm/meta-api/Chart.yaml)"
          PKG_DIR="$(mktemp -d)"
          helm package helm/meta-api -d "$PKG_DIR"
          helm push "$PKG_DIR/meta-api-${CHART_VERSION}.tgz" oci://ghcr.io/neoforged
        env:
          GH_USERNAME: '${{ github.actor }}'
          GH_TOKEN: '${{ github.token }}'
